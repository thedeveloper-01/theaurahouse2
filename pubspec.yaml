name: theaurahouse
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.0
  
  # Media
  image_picker: ^1.0.7
  image_picker_linux: ^0.2.2
  image_picker_windows: ^0.2.2
  video_player: ^2.8.2
  chewie: ^1.7.4
  wakelock_plus: ^1.4.0
  image: ^4.1.3
  video_thumbnail: ^0.5.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path_provider_linux: ^2.2.1
  path_provider_windows: ^2.3.0
  flutter_secure_storage: ^9.0.0
  
  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  intl: ^0.19.0
  timeago: ^3.6.1
  
  # Utils
  shared_preferences: ^2.2.2
  shared_preferences_linux: ^2.4.1
  shared_preferences_windows: ^2.4.1
  uuid: ^4.2.1
  path: ^1.8.3
  
  # WebSocket
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
